name: tradehub_demo
description: "TradeHub Demo - generic distribution / wholesale marketplace demo app (synthetic data only)"
publish_to: 'none'
version: 1.0.7+10

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  hugeicons: ^0.0.7
  go_router: ^14.2.0
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0
  image_picker: ^1.0.7
  intl: ^0.20.2
  dio: ^5.4.0
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  youtube_player_flutter: ^9.1.3
  video_player: ^2.9.2
  flutter_local_notifications: ^19.4.2
  share_plus: ^12.0.1
  url_launcher: ^6.3.2
  font_awesome_flutter: ^11.0.0
  flutter_blurhash: ^0.9.1
  path_provider: ^2.1.5
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  permission_handler: 12.0.3
  socket_io_client: ^3.1.6
  package_info_plus: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/legal/
